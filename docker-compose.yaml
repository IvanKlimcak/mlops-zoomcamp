version: "3.8"
services:
  mlflow:
    build:
      context: .
      dockerfile: mlflow.dockerfile
    ports:
      - "5000:5000"
    volumes:
      - "${PWD}/mlflow_data:/home/mlflow_data/"
    networks:
      - app-network
    #  Add restart policy
    restart: always

networks:
  app-network:
    driver: bridge